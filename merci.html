
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Message envoyé | Digital Art Production</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main style="
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:30px;
        text-align:center;
        background:#1a1a1a;
    ">
        <div style="max-width:550px;">
            <h1 style="font-size:36px;margin-bottom:20px;">
                Merci pour votre message !
            </h1>

            <p style="
                color:#bbb;
                font-size:17px;
                line-height:1.8;
                margin-bottom:35px;
            ">
                Votre demande a bien été envoyée.
                Nous reviendrons vers vous dans les
                meilleurs délais.
            </p>

            <a href="index.html" style="
                display:inline-block;
                padding:14px 25px;
                border:1px solid #aaa;
                border-radius:8px;
                color:white;
                text-decoration:none;
                font-size:13px;
                letter-spacing:1px;
            ">
                RETOUR À L'ACCUEIL
            </a>
        </div>
    </main>
</body>
</html>
